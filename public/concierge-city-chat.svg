<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" fill="none" role="img" aria-label="Ask the City Chat Guide">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1000" y2="800" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff7ed"/>
      <stop offset="0.55" stop-color="#eef4ff"/>
      <stop offset="1" stop-color="#e0ecff"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fb923c"/>
      <stop offset="1" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#1e3a8a" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="1000" height="800" fill="url(#bg)"/>

  <!-- faint map grid -->
  <g stroke="#cdddff" stroke-width="2" opacity="0.5">
    <path d="M0 180 H1000 M0 360 H1000 M0 540 H1000 M0 720 H1000"/>
    <path d="M200 0 V800 M460 0 V800 M720 0 V800"/>
  </g>

  <!-- route with pins -->
  <path d="M150 660 C 320 600 300 430 470 420 S 740 470 840 300" stroke="url(#blue)" stroke-width="10" stroke-linecap="round" stroke-dasharray="2 26" opacity="0.85"/>
  <g>
    <circle cx="150" cy="660" r="16" fill="url(#orange)"/><circle cx="150" cy="660" r="6" fill="#fff"/>
    <circle cx="470" cy="420" r="16" fill="url(#blue)"/><circle cx="470" cy="420" r="6" fill="#fff"/>
    <circle cx="840" cy="300" r="16" fill="url(#orange)"/><circle cx="840" cy="300" r="6" fill="#fff"/>
  </g>

  <!-- CityMitra brand mark -->
  <g transform="translate(96 96)">
    <rect width="92" height="92" rx="26" fill="url(#orange)"/>
    <path d="M46 22c-12 0-22 10-22 22 0 16 22 34 22 34s22-18 22-34c0-12-10-22-22-22z" fill="#fff"/>
    <circle cx="46" cy="42" r="9" fill="url(#orange)"/>
  </g>
  <text x="208" y="158" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="52" font-weight="800" fill="#0f172a">City Chat</text>

  <!-- sparkles -->
  <g fill="url(#blue)">
    <path d="M300 250 l10 26 26 10 -26 10 -10 26 -10 -26 -26 -10 26 -10z"/>
    <path d="M250 330 l6 16 16 6 -16 6 -6 16 -6 -16 -16 -6 16 -6z" opacity="0.7"/>
  </g>

  <!-- chat bubble card -->
  <g filter="url(#soft)">
    <rect x="540" y="250" width="380" height="250" rx="28" fill="#ffffff"/>
  </g>
  <g transform="translate(572 286)">
    <rect width="34" height="34" rx="10" fill="url(#orange)"/>
    <path d="M17 8c-4.5 0-8 3.5-8 8 0 6 8 13 8 13s8-7 8-13c0-4.5-3.5-8-8-8z" fill="#fff"/>
    <text x="46" y="24" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="22" font-weight="800" fill="#0f172a">CityMitra</text>
  </g>
  <rect x="572" y="336" width="316" height="14" rx="7" fill="#e2e8f0"/>
  <rect x="572" y="362" width="270" height="14" rx="7" fill="#e2e8f0"/>
  <g font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="18" font-weight="700" fill="#2563eb">
    <rect x="572" y="402" width="170" height="40" rx="20" fill="#eaf1ff"/>
    <text x="592" y="428">Best places to visit</text>
    <rect x="572" y="452" width="140" height="40" rx="20" fill="#fff1e6"/>
    <text x="592" y="478" fill="#ea580c">1-day itinerary</text>
  </g>
</svg>
