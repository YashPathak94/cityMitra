<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <script src="./ds-base.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap">
  <style>
    body{margin:0;background:#FFF7ED;font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Arial,sans-serif}
    a{color:#0F172A;text-decoration:none}
    a:hover{color:#EA580C}
    @keyframes cmPulse{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.3)}}
    @media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}}
  </style>
</helmet>
<div ref="{{ rootRef }}">
  <div data-screen-label="City Guide" style="min-height:100vh;background:var(--bg,#FFF7ED);color:var(--ink,#0F172A);font-family:'Plus Jakarta Sans',system-ui,sans-serif;overflow-x:clip">

    <div style="position:sticky;top:14px;z-index:60;max-width:1240px;margin:0 auto;padding:16px 32px 0">
      <dc-import name="SiteNav" active="guide" hint-size="100%,64px"></dc-import>
    </div>

    <header style="position:relative;padding:64px 0 12px">
      <div style="position:absolute;top:-200px;right:-140px;width:600px;height:600px;border-radius:50%;background:radial-gradient(circle,var(--heroA,rgba(249,115,22,.18)),transparent 65%);pointer-events:none"></div>
      <div style="position:relative;max-width:1240px;margin:0 auto;padding:0 32px">
        <div style="display:inline-flex;align-items:center;gap:10px;padding:9px 16px;border-radius:999px;background:var(--chip,#FFEDD5);color:var(--orange,#EA580C);font-size:12px;font-weight:600;letter-spacing:.16em;text-transform:uppercase">City Guide</div>
        <h1 style="margin:18px 0 0;font-size:var(--h1,clamp(64px,8.2vw,122px));line-height:.93;letter-spacing:-.02em;font-weight:400;font-family:'Instrument Serif',Georgia,serif">500+ cities,<br><span style="background:var(--mut,#64748B);-webkit-background-clip:text;background-clip:text;color:transparent">decoded.</span></h1>
        <p style="margin:20px 0 0;max-width:460px;font-size:17px;line-height:1.55;color:var(--mut,#64748B);font-weight:500">Seven launch cities live now. Tap one — every category inside is mapped, verified and backed up.</p>
      </div>
    </header>

    <!-- CITY BENTO -->
    <section data-reveal="true" style="max-width:1240px;margin:0 auto;padding:44px 32px 0">
      <div style="display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:172px;gap:16px">
        <button data-city="Delhi" onClick="{{ pickCity }}" style="grid-column:span 2;grid-row:span 2;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-start;gap:6px;padding:24px;border:none;border-radius:var(--rad,24px);background:linear-gradient(150deg,#6F6F6F,#000000 55%,#9A3412);box-shadow:0 18px 44px rgba(15,23,42,.18);color:#FFFFFF;font-family:'Plus Jakarta Sans',sans-serif;cursor:pointer;text-align:left;transition:transform .25s cubic-bezier(.22,1,.36,1)" style-hover="transform:translateY(-6px)">
          <span aria-hidden="true" style="position:absolute;top:-.24em;right:.02em;font-size:300px;font-weight:600;line-height:1;color:rgba(255,255,255,.16);pointer-events:none">D</span>
          <span style="padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.2);font-size:10.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;backdrop-filter:blur(6px)">flagship</span>
          <b style="font-size:46px;font-weight:600;letter-spacing:-.03em;line-height:1">Delhi</b>
          <span style="font-size:12.5px;font-weight:600;opacity:.85">Wholesale capital · street food · metro everywhere</span>
        </button>
        <button data-city="Mumbai" onClick="{{ pickCity }}" style="grid-column:span 2;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-start;gap:6px;padding:24px;border:none;border-radius:var(--rad,24px);background:linear-gradient(150deg,#8A8A8A,#000000);box-shadow:0 18px 44px rgba(15,23,42,.18);color:#FFFFFF;font-family:'Plus Jakarta Sans',sans-serif;cursor:pointer;text-align:left;transition:transform .25s cubic-bezier(.22,1,.36,1)" style-hover="transform:translateY(-6px)">
          <span aria-hidden="true" style="position:absolute;top:-.24em;right:.02em;font-size:150px;font-weight:600;line-height:1;color:rgba(255,255,255,.16);pointer-events:none">M</span>
          <span style="padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.2);font-size:10.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;backdrop-filter:blur(6px)">live</span>
          <b style="font-size:28px;font-weight:600;letter-spacing:-.03em;line-height:1">Mumbai</b>
          <span style="font-size:12.5px;font-weight:600;opacity:.85">Sea link · late nights</span>
        </button>
        <button data-city="Bengaluru" onClick="{{ pickCity }}" style="position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-start;gap:6px;padding:24px;border:none;border-radius:var(--rad,24px);background:linear-gradient(150deg,#000000,#000000);box-shadow:0 18px 44px rgba(15,23,42,.18);color:#FFFFFF;font-family:'Plus Jakarta Sans',sans-serif;cursor:pointer;text-align:left;transition:transform .25s cubic-bezier(.22,1,.36,1)" style-hover="transform:translateY(-6px)">
          <span aria-hidden="true" style="position:absolute;top:-.24em;right:.02em;font-size:150px;font-weight:600;line-height:1;color:rgba(255,255,255,.16);pointer-events:none">B</span>
          <span style="padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.2);font-size:10.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;backdrop-filter:blur(6px)">live</span>
          <b style="font-size:28px;font-weight:600;letter-spacing:-.03em;line-height:1">Bengaluru</b>
          <span style="font-size:12.5px;font-weight:600;opacity:.85">Cafes · tech · traffic hacks</span>
        </button>
        <button data-city="Jaipur" onClick="{{ pickCity }}" style="position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-start;gap:6px;padding:24px;border:none;border-radius:var(--rad,24px);background:linear-gradient(150deg,#000000,#6F6F6F);box-shadow:0 18px 44px rgba(15,23,42,.18);color:#FFFFFF;font-family:'Plus Jakarta Sans',sans-serif;cursor:pointer;text-align:left;transition:transform .25s cubic-bezier(.22,1,.36,1)" style-hover="transform:translateY(-6px)">
          <span aria-hidden="true" style="position:absolute;top:-.24em;right:.02em;font-size:150px;font-weight:600;line-height:1;color:rgba(255,255,255,.16);pointer-events:none">J</span>
          <span style="padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.2);font-size:10.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;backdrop-filter:blur(6px)">live</span>
          <b style="font-size:28px;font-weight:600;letter-spacing:-.03em;line-height:1">Jaipur</b>
          <span style="font-size:12.5px;font-weight:600;opacity:.85">Forts · bazaars</span>
        </button>
        <button data-city="Surat" onClick="{{ pickCity }}" style="position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-start;gap:6px;padding:24px;border:none;border-radius:var(--rad,24px);background:linear-gradient(150deg,#000000,#06B6D4);box-shadow:0 18px 44px rgba(15,23,42,.18);color:#FFFFFF;font-family:'Plus Jakarta Sans',sans-serif;cursor:pointer;text-align:left;transition:transform .25s cubic-bezier(.22,1,.36,1)" style-hover="transform:translateY(-6px)">
          <span aria-hidden="true" style="position:absolute;top:-.24em;right:.02em;font-size:150px;font-weight:600;line-height:1;color:rgba(255,255,255,.16);pointer-events:none">S</span>
          <span style="padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.2);font-size:10.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;backdrop-filter:blur(6px)">live</span>
          <b style="font-size:28px;font-weight:600;letter-spacing:-.03em;line-height:1">Surat</b>
          <span style="font-size:12.5px;font-weight:600;opacity:.85">Textile trade runs</span>
        </button>
        <button data-city="Hyderabad" onClick="{{ pickCity }}" style="grid-column:span 2;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-start;gap:6px;padding:24px;border:none;border-radius:var(--rad,24px);background:linear-gradient(150deg,#000000,#000000);box-shadow:0 18px 44px rgba(15,23,42,.18);color:#FFFFFF;font-family:'Plus Jakarta Sans',sans-serif;cursor:pointer;text-align:left;transition:transform .25s cubic-bezier(.22,1,.36,1)" style-hover="transform:translateY(-6px)">
          <span aria-hidden="true" style="position:absolute;top:-.24em;right:.02em;font-size:150px;font-weight:600;line-height:1;color:rgba(255,255,255,.16);pointer-events:none">H</span>
          <span style="padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.2);font-size:10.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;backdrop-filter:blur(6px)">live</span>
          <b style="font-size:28px;font-weight:600;letter-spacing:-.03em;line-height:1">Hyderabad</b>
          <span style="font-size:12.5px;font-weight:600;opacity:.85">Biryani · pearls · old city lanes</span>
        </button>
        <button data-city="Leh" onClick="{{ pickCity }}" style="position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-start;gap:6px;padding:24px;border:none;border-radius:var(--rad,24px);background:linear-gradient(150deg,#334155,#000000);box-shadow:0 18px 44px rgba(15,23,42,.18);color:#FFFFFF;font-family:'Plus Jakarta Sans',sans-serif;cursor:pointer;text-align:left;transition:transform .25s cubic-bezier(.22,1,.36,1)" style-hover="transform:translateY(-6px)">
          <span aria-hidden="true" style="position:absolute;top:-.24em;right:.02em;font-size:150px;font-weight:600;line-height:1;color:rgba(255,255,255,.16);pointer-events:none">L</span>
          <span style="padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.2);font-size:10.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;backdrop-filter:blur(6px)">seasonal</span>
          <b style="font-size:28px;font-weight:600;letter-spacing:-.03em;line-height:1">Leh</b>
          <span style="font-size:12.5px;font-weight:600;opacity:.85">High passes · slow wifi</span>
        </button>
      </div>
    </section>

    <!-- CATEGORY CLOUD -->
    <section data-reveal="true" style="max-width:1240px;margin:0 auto;padding:88px 32px 104px">
      <div style="display:flex;align-items:end;justify-content:space-between;gap:24px;flex-wrap:wrap">
        <div>
          <div style="font-size:12px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--orange,#EA580C)">Every category</div>
          <h2 style="margin:10px 0 0;font-size:var(--h2,clamp(38px,4vw,62px));line-height:1;letter-spacing:-.02em;font-weight:400;font-family:'Instrument Serif',Georgia,serif">All of <span style="background:var(--mut,#64748B);-webkit-background-clip:text;background-clip:text;color:transparent">{{ city }}</span>, mapped.</h2>
        </div>
        <a href="./CityChat.dc.html" style="display:inline-flex;align-items:center;gap:10px;min-height:52px;padding:0 24px;border-radius:999px;background:linear-gradient(135deg,#FB923C,#EA580C 55%,#2563EB);color:#FFFFFF;font-size:14px;font-weight:600;box-shadow:0 12px 30px rgba(0,0,0,.3);transition:transform .25s cubic-bezier(.22,1,.36,1)" style-hover="transform:translateY(-3px);color:#FFFFFF">Ask about {{ city }} <span aria-hidden="true">→</span></a>
      </div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:30px">
        <sc-for list="{{ catCloud }}" as="k" hint-placeholder-count="12">
          <a href="./GenzSite.dc.html#finder" style="display:inline-flex;align-items:center;gap:8px;min-height:46px;padding:0 19px;border-radius:999px;border:1px solid var(--cardBd,#F4DFD2);background:var(--card,#FFFFFF);box-shadow:var(--cardSh,0 2px 10px rgba(15,23,42,.05));backdrop-filter:var(--blur,none);color:var(--ink,#0F172A);font-size:13.5px;font-weight:700;transition:transform .2s cubic-bezier(.22,1,.36,1)" style-hover="transform:translateY(-3px);color:var(--orange,#EA580C)">
            <span style="width:8px;height:8px;border-radius:50%;background:var(--acc,#0891B2)"></span>{{ k.label }}
          </a>
        </sc-for>
      </div>
    </section>

    <dc-import name="SiteFooter" hint-size="100%,520px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{
  &quot;theme&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;light&quot;, &quot;night&quot;], &quot;default&quot;: &quot;light&quot;, &quot;tsType&quot;: &quot;'light' | 'night'&quot;, &quot;section&quot;: &quot;Theme&quot;},
  &quot;cardStyle&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;clay&quot;, &quot;glass&quot;], &quot;default&quot;: &quot;clay&quot;, &quot;tsType&quot;: &quot;'clay' | 'glass'&quot;, &quot;section&quot;: &quot;Surfaces&quot;},
  &quot;motion&quot;: {&quot;editor&quot;: &quot;range&quot;, &quot;min&quot;: 0, &quot;max&quot;: 10, &quot;step&quot;: 1, &quot;default&quot;: 7, &quot;tsType&quot;: &quot;number&quot;, &quot;section&quot;: &quot;Motion&quot;}
}">
class Component extends DCLogic {
  state = { theme: null, city: 'Delhi' };

  componentDidMount() {
    window.addEventListener('cm-theme', this._onTheme = (e) => this.setState({ theme: e.detail }));
    import(new URL('./theme.js', location.href).href).then((T) => {
      this.T = T;
      const saved = localStorage.getItem('cm-theme');
      this.setState({ theme: saved || this.state.theme });
      requestAnimationFrame(() => { T.reveals((this.props.motion ?? 7) / 7); this._applyTheme(); });
    });
  }
  componentDidUpdate() { this._applyTheme(); }
  componentWillUnmount() { window.removeEventListener('cm-theme', this._onTheme); }
  _theme() { return this.state.theme || this.props.theme || 'light'; }
  rootRef = React.createRef();
  _applyTheme() {
    if (!this.T || !this.rootRef.current) return;
    this.T.applyVars(this.rootRef.current, this.T.cmVars({
      theme: this._theme(), accent: this.props.accent, cardStyle: this.props.cardStyle,
      motion: this.props.motion, typeScale: this.props.typeScale,
    }));
    this.T.syncBody(this._theme());
  }

  renderVals() {

    const CATS = ['Wholesale', 'Sarees', 'Electronics', 'Hospitals', 'Malls', 'Play Arena', 'Schools', 'Eateries', 'Grooming', 'Salon & Spa', 'Vehicle Repair', 'Plumber', 'Electrician', 'Carpenter', 'Pandit', 'Packers & Movers', 'Gym & Fitness', 'Laundry', 'AC Repair', 'Pest Control', 'Petrol Pumps', 'Hotels', 'Dinner', 'Sightseeing', 'Doctors', 'Sports Academy', 'EV Charging', 'Public Restrooms', 'News & Media', 'Agriculture'];
    const catCloud = CATS.map((k) => ({ label: k }));

    return {
      rootRef: this.rootRef, catCloud,
      city: this.state.city,
      pickCity: (e) => this.setState({ city: e.currentTarget.dataset.city }),
    };
  }
}
</script>
</body>
</html>
