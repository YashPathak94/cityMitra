<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <script src="./ds-base.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap">
  <style>
    nav[data-cm-active="home"] a[data-nav="home"],nav[data-cm-active="guide"] a[data-nav="guide"],nav[data-cm-active="chat"] a[data-nav="chat"],nav[data-cm-active="plan"] a[data-nav="plan"],nav[data-cm-active="offers"] a[data-nav="offers"],nav[data-cm-active="pro"] a[data-nav="pro"]{background:var(--navCta,linear-gradient(135deg,#FB923C,#EA580C 55%,#2563EB)) !important;color:var(--navCtaInk,#FFFFFF) !important}
  </style>
</helmet>
<div style="display:flex;align-items:center;gap:16px;padding:10px 12px 10px 16px;border-radius:999px;background:var(--nav,rgba(255,247,237,.85));border:1px solid var(--cardBd,#F4DFD2);backdrop-filter:blur(16px) saturate(1.2);box-shadow:0 10px 30px rgba(15,23,42,.08);font-family:'Plus Jakarta Sans',system-ui,sans-serif">
  <a href="./GenzSite.dc.html" style="display:flex;align-items:center;gap:10px;color:var(--ink,#0F172A)" style-hover="color:var(--ink,#0F172A)">
    <x-import component-from-global-scope="CityMitraUI.Logo" size="36" hint-size="36px,36px"></x-import>
    <span style="display:flex;flex-direction:column;line-height:1.15">
      <b style="font-size:15px;font-weight:600;letter-spacing:-.01em">CityMitra</b>
      <x-import component-from-global-scope="CityMitraUI.Tagline" hint-size="118px,13px"></x-import>
    </span>
  </a>
  <nav data-cm-active="{{ active }}" style="display:flex;align-items:center;gap:2px;margin-left:6px">
    <a data-nav="home" href="./GenzSite.dc.html" style="padding:9px 13px;border-radius:999px;font-size:13.5px;font-weight:700;background:transparent;color:var(--mut,#64748B);transition:color .2s" style-hover="color:var(--orange,#EA580C)">Home</a>
    <a data-nav="guide" href="./CityGuide.dc.html" style="padding:9px 13px;border-radius:999px;font-size:13.5px;font-weight:700;background:transparent;color:var(--mut,#64748B);transition:color .2s" style-hover="color:var(--orange,#EA580C)">City Guide</a>
    <a data-nav="chat" href="./CityChat.dc.html" style="padding:9px 13px;border-radius:999px;font-size:13.5px;font-weight:700;background:transparent;color:var(--mut,#64748B);transition:color .2s" style-hover="color:var(--orange,#EA580C)">City Chat</a>
    <a data-nav="plan" href="./TravelPlan.dc.html" style="padding:9px 13px;border-radius:999px;font-size:13.5px;font-weight:700;background:transparent;color:var(--mut,#64748B);transition:color .2s" style-hover="color:var(--orange,#EA580C)">Travel Plan</a>
    <a data-nav="offers" href="./Offers.dc.html" style="padding:9px 13px;border-radius:999px;font-size:13.5px;font-weight:700;background:transparent;color:var(--mut,#64748B);transition:color .2s" style-hover="color:var(--orange,#EA580C)">Offers</a>
    <a data-nav="pro" href="./Pro.dc.html" style="padding:9px 13px;border-radius:999px;font-size:13.5px;font-weight:700;background:transparent;color:var(--mut,#64748B);transition:color .2s" style-hover="color:var(--orange,#EA580C)">Pro</a>
  </nav>
  <div style="display:flex;align-items:center;gap:8px;margin-left:auto">
    <button onClick="{{ toggle }}" title="Toggle night mode" style="display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--cardBd,#F4DFD2);background:var(--chip,#FFEDD5);color:var(--ink,#0F172A);font-family:'Plus Jakarta Sans',sans-serif;font-size:12.5px;font-weight:600;cursor:pointer;transition:transform .2s cubic-bezier(.22,1,.36,1)" style-hover="transform:translateY(-2px)">
      <span style="width:12px;height:12px;border-radius:50%;background:linear-gradient(135deg,#EA580C,#2563EB);box-shadow:0 0 8px rgba(234,88,12,.55)"></span>{{ toggleLabel }}
    </button>
    <a href="#" style="padding:9px 12px;font-size:13px;font-weight:700;color:var(--mut,#64748B)" style-hover="color:var(--orange,#EA580C)">Log in</a>
    <a href="./CityChat.dc.html" style="display:inline-flex;align-items:center;gap:8px;min-height:42px;padding:0 20px;border-radius:999px;background:var(--navCta,linear-gradient(135deg,#FB923C,#EA580C 55%,#2563EB));color:var(--navCtaInk,#FFFFFF);font-size:13.5px;font-weight:600;box-shadow:var(--navCtaSh,0 10px 26px rgba(0,0,0,.32));transition:transform .2s cubic-bezier(.22,1,.36,1)" style-hover="transform:translateY(-2px);color:var(--navCtaInk,#FFFFFF)">Ask AI</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{
  &quot;$preview&quot;: {&quot;width&quot;: 1180, &quot;height&quot;: 96},
  &quot;active&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;home&quot;, &quot;guide&quot;, &quot;chat&quot;, &quot;plan&quot;, &quot;offers&quot;, &quot;pro&quot;, &quot;partner&quot;, &quot;about&quot;], &quot;default&quot;: &quot;home&quot;, &quot;tsType&quot;: &quot;string&quot;}
}">
class Component extends DCLogic {
  state = { theme: localStorage.getItem('cm-theme') || 'light' };
  componentDidMount() {
    window.addEventListener('cm-theme', this._t = (e) => this.setState({ theme: e.detail }));
  }
  componentWillUnmount() { window.removeEventListener('cm-theme', this._t); }
  renderVals() {
    const night = this.state.theme === 'night';
    return {
      active: this.props.active || '',
      toggleLabel: night ? 'Day' : 'Night',
      toggle: () => {
        const t = night ? 'light' : 'night';
        localStorage.setItem('cm-theme', t);
        window.dispatchEvent(new CustomEvent('cm-theme', { detail: t }));
      },
    };
  }
}
</script>
</body>
</html>
