<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <script src="./ds-base.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap">
  <style>
    body{margin:0;background:#FFF7ED;font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Arial,sans-serif}
    a{color:#0F172A;text-decoration:none}
    a:hover{color:#EA580C}
    button[data-cm-sel="true"]{background:var(--chip,#FFEDD5) !important;border-color:var(--cardBd,#F4DFD2) !important}
    @keyframes cmPop{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:none}}
    @keyframes cmBlink{0%,80%,100%{opacity:.25}40%{opacity:1}}
    @keyframes cmPulse{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.3)}}
    @media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}}
  </style>
</helmet>
<div ref="{{ rootRef }}">
  <div data-screen-label="City Chat" style="min-height:100vh;background:var(--bg,#FFF7ED);color:var(--ink,#0F172A);font-family:'Plus Jakarta Sans',system-ui,sans-serif;overflow-x:clip;display:flex;flex-direction:column">

    <div style="position:sticky;top:14px;z-index:60;max-width:1240px;width:100%;margin:0 auto;padding:16px 32px 0;box-sizing:border-box">
      <dc-import name="SiteNav" active="chat" hint-size="100%,64px"></dc-import>
    </div>

    <section style="position:relative;flex:1;max-width:1240px;width:100%;margin:0 auto;padding:28px 32px 40px;box-sizing:border-box;display:grid;grid-template-columns:290px 1fr;gap:20px;align-items:stretch;min-height:680px">
      <div style="position:absolute;top:-140px;right:-100px;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,var(--heroB,rgba(37,99,235,.16)),transparent 65%);pointer-events:none"></div>

      <!-- SIDEBAR -->
      <aside style="position:relative;display:flex;flex-direction:column;gap:14px;padding:22px;background:var(--card,#FFFFFF);border:1px solid var(--cardBd,#F4DFD2);border-radius:var(--rad,24px);box-shadow:var(--cardSh,0 2px 10px rgba(15,23,42,.05));backdrop-filter:var(--blur,none)">
        <button onClick="{{ newChat }}" style="display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;border:none;border-radius:999px;background:linear-gradient(135deg,#FB923C,#EA580C 55%,#2563EB);color:#FFFFFF;font-family:'Plus Jakarta Sans',sans-serif;font-size:14px;font-weight:600;cursor:pointer;box-shadow:0 10px 26px rgba(0,0,0,.3);transition:transform .2s cubic-bezier(.22,1,.36,1)" style-hover="transform:translateY(-2px)">+ New chat</button>
        <div style="font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--mut,#64748B);margin-top:6px">Recent</div>
        <sc-for list="{{ recents }}" as="r" hint-placeholder-count="3">
          <button onClick="{{ r.pick }}" data-cm-sel="{{ r.on }}" style="text-align:left;padding:13px 15px;border-radius:16px;border:1px solid transparent;background:transparent;color:var(--ink,#0F172A);font-family:'Plus Jakarta Sans',sans-serif;cursor:pointer;transition:transform .2s cubic-bezier(.22,1,.36,1)" style-hover="transform:translateX(3px)">
            <b style="display:block;font-size:13.5px;font-weight:600">{{ r.title }}</b>
            <span style="display:block;margin-top:3px;font-size:11.5px;font-weight:600;color:var(--mut,#64748B)">{{ r.sub }}</span>
          </button>
        </sc-for>
        <div style="margin-top:auto;padding:16px;border-radius:18px;background:var(--chip,#FFEDD5)">
          <b style="font-size:12.5px;font-weight:600;color:var(--orange,#EA580C)">Pro tip</b>
          <p style="margin:5px 0 0;font-size:12px;line-height:1.5;color:var(--mut,#64748B);font-weight:600">Ask for backups. Every plan comes with a plan B baked in.</p>
        </div>
      </aside>

      <!-- CHAT PANEL -->
      <div style="position:relative;display:flex;flex-direction:column;background:var(--card,#FFFFFF);border:1px solid var(--cardBd,#F4DFD2);border-radius:var(--rad,24px);box-shadow:var(--cardSh,0 2px 10px rgba(15,23,42,.05));backdrop-filter:var(--blur,none);overflow:hidden">
        <div style="display:flex;align-items:center;gap:12px;padding:16px 22px;border-bottom:1px solid var(--line,#F4DFD2)">
          <x-import component-from-global-scope="CityMitraUI.Logo" size="34" hint-size="34px,34px"></x-import>
          <div style="line-height:1.2">
            <b style="font-size:15px;font-weight:600">City Chat</b>
            <div style="display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;color:var(--mut,#64748B)">
              <span style="width:7px;height:7px;border-radius:50%;background:#059669;animation:cmPulse 2.2s ease-in-out infinite;animation-play-state:var(--marq,running)"></span>Delhi · synced
            </div>
          </div>
          <span style="margin-left:auto;padding:7px 13px;border-radius:999px;background:var(--chip,#FFEDD5);font-size:11.5px;font-weight:600;color:var(--acc,#0891B2);letter-spacing:.06em">MITRA AI · V2</span>
        </div>

        <div ref="{{ listRef }}" style="flex:1;overflow-y:auto;padding:24px 22px;display:flex;flex-direction:column;gap:14px">
          <sc-for list="{{ msgs }}" as="m" hint-placeholder-count="3">
            <sc-if value="{{ m.isUser }}" hint-placeholder-val="{{ false }}">
              <div style="display:flex;justify-content:flex-end">
                <div style="max-width:72%;padding:14px 18px;border-radius:18px 18px 6px 18px;background:linear-gradient(135deg,#EA580C,#2563EB);color:#FFFFFF;border:1px solid transparent;font-size:14px;line-height:1.55;font-weight:600;animation:cmPop .35s cubic-bezier(.22,1,.36,1) both">{{ m.text }}</div>
              </div>
            </sc-if>
            <sc-if value="{{ m.isAi }}" hint-placeholder-val="{{ true }}">
              <div style="display:flex;justify-content:flex-start">
                <div style="max-width:72%;padding:14px 18px;border-radius:18px 18px 18px 6px;background:var(--bg2,#FFF3E8);color:var(--ink,#0F172A);border:1px solid var(--line,#F4DFD2);font-size:14px;line-height:1.55;font-weight:600;animation:cmPop .35s cubic-bezier(.22,1,.36,1) both">
                {{ m.text }}
                <sc-if value="{{ m.hasItin }}" hint-placeholder-val="{{ false }}">
                  <div style="margin-top:12px;padding:14px;border-radius:16px;background:var(--bg2,#FFF3E8);border:1px solid var(--line,#F4DFD2)">
                    <b style="font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--orange,#EA580C)">Jaipur · 2 days · ₹7,450</b>
                    <div style="display:flex;flex-direction:column;gap:8px;margin-top:10px">
                      <sc-for list="{{ m.itin }}" as="i" hint-placeholder-count="3">
                        <div style="display:flex;gap:10px;align-items:baseline">
                          <span style="flex:none;width:70px;font-size:11.5px;font-weight:600;color:var(--blue,#2563EB);font-variant-numeric:tabular-nums">{{ i.t }}</span>
                          <span style="font-size:13px;font-weight:600;color:var(--ink,#0F172A)">{{ i.x }}</span>
                        </div>
                      </sc-for>
                    </div>
                    <div style="display:flex;gap:8px;margin-top:12px">
                      <a href="https://www.google.com/maps/search/?api=1&amp;query=Jaipur+Amber+Fort" target="_blank" rel="noreferrer" style="display:inline-flex;align-items:center;min-height:38px;padding:0 15px;border-radius:999px;background:linear-gradient(135deg,#EA580C,#2563EB);color:#FFFFFF;font-size:12px;font-weight:600" style-hover="color:#FFFFFF">Open map ↗</a>
                      <a href="./TravelPlan.dc.html" style="display:inline-flex;align-items:center;min-height:38px;padding:0 15px;border-radius:999px;border:1px solid var(--cardBd,#F4DFD2);color:var(--ink,#0F172A);font-size:12px;font-weight:600" style-hover="color:var(--orange,#EA580C)">Fund this trip</a>
                    </div>
                  </div>
                </sc-if>
                </div>
              </div>
            </sc-if>
          </sc-for>
          <sc-if value="{{ typing }}" hint-placeholder-val="{{ false }}">
            <div style="display:flex;justify-content:flex-start">
              <div style="display:flex;gap:5px;padding:16px 18px;border-radius:18px 18px 18px 6px;background:var(--bg2,#FFF3E8);border:1px solid var(--line,#F4DFD2)">
                <span style="width:7px;height:7px;border-radius:50%;background:var(--mut,#64748B);animation:cmBlink 1.2s infinite"></span>
                <span style="width:7px;height:7px;border-radius:50%;background:var(--mut,#64748B);animation:cmBlink 1.2s .2s infinite"></span>
                <span style="width:7px;height:7px;border-radius:50%;background:var(--mut,#64748B);animation:cmBlink 1.2s .4s infinite"></span>
              </div>
            </div>
          </sc-if>
        </div>

        <div style="padding:14px 22px 18px;border-top:1px solid var(--line,#F4DFD2)">
          <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">
            <sc-for list="{{ suggestions }}" as="s" hint-placeholder-count="4">
              <button onClick="{{ s.pick }}" style="min-height:38px;padding:0 15px;border-radius:999px;border:1px solid var(--cardBd,#F4DFD2);background:var(--chip,#FFEDD5);color:var(--ink,#0F172A);font-family:'Plus Jakarta Sans',sans-serif;font-size:12.5px;font-weight:700;cursor:pointer;transition:transform .2s cubic-bezier(.22,1,.36,1)" style-hover="transform:translateY(-2px);color:var(--orange,#EA580C)">{{ s.label }}</button>
            </sc-for>
          </div>
          <div style="display:flex;gap:10px;align-items:center">
            <input value="{{ draft }}" onChange="{{ onDraft }}" onKeyDown="{{ onKey }}" placeholder="Ask anything about any Indian city…" style="flex:1;min-height:54px;padding:0 22px;border-radius:999px;border:1px solid var(--cardBd,#F4DFD2);background:var(--bg2,#FFF3E8);color:var(--ink,#0F172A);font-family:'Plus Jakarta Sans',sans-serif;font-size:14.5px;font-weight:600;outline:none"></input>
            <button onClick="{{ send }}" title="Send" style="flex:none;width:54px;height:54px;border:none;border-radius:50%;background:linear-gradient(135deg,#FB923C,#EA580C 55%,#2563EB);color:#FFFFFF;font-size:20px;font-weight:600;cursor:pointer;box-shadow:0 10px 26px rgba(0,0,0,.35);transition:transform .2s cubic-bezier(.22,1,.36,1)" style-hover="transform:translateY(-2px) scale(1.04)">→</button>
          </div>
          <div style="margin-top:10px;text-align:center;font-size:10.5px;font-weight:600;color:var(--mut,#64748B)">Mitra can misread a city. Double-check hours &amp; fares before you head out.</div>
        </div>
      </div>
    </section>

    <dc-import name="SiteFooter" hint-size="100%,520px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{
  &quot;theme&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;light&quot;, &quot;night&quot;], &quot;default&quot;: &quot;light&quot;, &quot;tsType&quot;: &quot;'light' | 'night'&quot;, &quot;section&quot;: &quot;Theme&quot;},
  &quot;cardStyle&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;clay&quot;, &quot;glass&quot;], &quot;default&quot;: &quot;clay&quot;, &quot;tsType&quot;: &quot;'clay' | 'glass'&quot;, &quot;section&quot;: &quot;Surfaces&quot;},
  &quot;motion&quot;: {&quot;editor&quot;: &quot;range&quot;, &quot;min&quot;: 0, &quot;max&quot;: 10, &quot;step&quot;: 1, &quot;default&quot;: 7, &quot;tsType&quot;: &quot;number&quot;, &quot;section&quot;: &quot;Motion&quot;}
}">
class Component extends DCLogic {
  state = {
    theme: null, draft: '', typing: false, chat: 0,
    msgs: [
      { who: 'ai', text: 'Namaste! Where are we headed? I do routes, budgets and backups — the works.' },
      { who: 'user', text: 'Weekend in Jaipur under \u20B98k?' },
      { who: 'ai', text: 'Easy. Here\u2019s the shape of it — metro + walking, one splurge thali, backups on every stop:', itin: [
        { t: 'Sat 07:00', x: 'Amber Fort — beat the heat, skip-the-line gate 2' },
        { t: 'Sat 13:00', x: 'LMB thali \u00B7 \u20B9350 — the splurge' },
        { t: 'Sun 10:00', x: 'Johri Bazaar \u00B7 backup: Bapu Bazaar' },
      ] },
    ],
  };
  listRef = React.createRef();
  rootRef = React.createRef();
  _applyTheme() {
    if (!this.T || !this.rootRef.current) return;
    this.T.applyVars(this.rootRef.current, this.T.cmVars({
      theme: this._theme(), accent: this.props.accent, cardStyle: this.props.cardStyle,
      motion: this.props.motion, typeScale: this.props.typeScale,
    }));
    this.T.syncBody(this._theme());
  }

  componentDidMount() {
    window.addEventListener('cm-theme', this._onTheme = (e) => this.setState({ theme: e.detail }));
    import(new URL('./theme.js', location.href).href).then((T) => {
      this.T = T;
      const saved = localStorage.getItem('cm-theme');
      this.setState({ theme: saved || this.state.theme });
      requestAnimationFrame(() => this._applyTheme());
    });
  }
  componentDidUpdate() {
    this._applyTheme();
    const el = this.listRef.current;
    if (el) el.scrollTop = el.scrollHeight;
  }
  componentWillUnmount() {
    window.removeEventListener('cm-theme', this._onTheme);
    if (this._timer) clearTimeout(this._timer);
  }
  _theme() { return this.state.theme || this.props.theme || 'light'; }

  _send(text) {
    const t = (text || '').trim();
    if (!t || this.state.typing) return;
    const REPLIES = [
      'On it. Three picks, all metro-friendly, one backup each. Want them pinned on a map?',
      'Done — cheapest window is Thu\u2013Sat. Fares lined up, stay under budget, fallback ready.',
      'Sorted. Start early, keep two alternate lanes ready, cap the auto at \u20B9120. Map\u2019s one tap away.',
    ];
    const i = this._r || 0; this._r = (i + 1) % REPLIES.length;
    this.setState({ msgs: [...this.state.msgs, { who: 'user', text: t }], draft: '', typing: true });
    this._timer = setTimeout(() => {
      this.setState({ msgs: [...this.state.msgs, { who: 'ai', text: REPLIES[i] }], typing: false });
    }, 950);
  }

  renderVals() {
    const msgs = this.state.msgs.map((m) => {
      const user = m.who === 'user';
      return { text: m.text, isUser: user, isAi: !user, hasItin: !!m.itin, itin: m.itin || [] };
    });

    const recents = [
      { title: 'Weekend in Jaipur', sub: '\u20B98k budget · 2 days', on: this.state.chat === 0 },
      { title: 'EV route Delhi → Agra', sub: '3 fast chargers pinned', on: this.state.chat === 1 },
      { title: 'Wholesale run · Surat', sub: 'textiles · 6 stops', on: this.state.chat === 2 },
    ].map((r2, i) => ({ ...r2, pick: () => this.setState({ chat: i }) }));

    const suggestions = ['Late-night eats near me', 'Best EV route to Agra', 'Wholesale run plan for Surat', 'Monsoon escape under \u20B915k'].map((t3) => ({
      label: t3, pick: () => this._send(t3),
    }));

    return {
      rootRef: this.rootRef, msgs, recents, suggestions,
      typing: this.state.typing,
      draft: this.state.draft,
      onDraft: (e) => this.setState({ draft: e.target.value }),
      onKey: (e) => { if (e.key === 'Enter') this._send(this.state.draft); },
      send: () => this._send(this.state.draft),
      newChat: () => this.setState({ msgs: [{ who: 'ai', text: 'Fresh slate. Which city are we decoding today?' }], draft: '', typing: false }),
    };
  }
}
</script>
</body>
</html>
